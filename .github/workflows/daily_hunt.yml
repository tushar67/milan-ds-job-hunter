name: Milan DS Job Hunter

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 8:00 AM CET (7:00 AM UTC)
  workflow_dispatch:     # Lets you trigger a test run manually

permissions:
  contents: write        # Needed to commit jobs.csv, seen_jobs.json, outreach_drafts.md, outreach_log.json

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Hunter & Follow-Up Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python job_hunter.py
          python outreach_drafter.py check-followups

      - name: Commit new jobs and logs
        run: |
          git config --global user.name "Job Hunter Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add jobs.csv seen_jobs.json outreach_drafts.md outreach_log.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily Milan DS job matches & outreach log"
          git push
